<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Level your motorhome / RV with your phone." />
    <title>Libell</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <header class="topbar">
      <img class="topbar__icon" src="icons/icon.svg" alt="" width="28" height="28" />
      <h1 class="topbar__title">Libell</h1>
      <button id="share-button" class="topbar__share" type="button" aria-label="Share">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="18" cy="5" r="2.5" />
            <circle cx="6" cy="12" r="2.5" />
            <circle cx="18" cy="19" r="2.5" />
            <path d="M8.2 10.7 15.8 6.3M8.2 13.3l7.6 4.4" />
          </g>
        </svg>
      </button>
      <div class="topbar__actions">
        <div id="indicators" class="topbar__indicators"></div>
        <button id="install-button" class="topbar__install" type="button" hidden>Install</button>
      </div>
      <!-- The sensor-status icon is appended here by main.ts — last on
           purpose, so it always owns the top-right corner (everything
           else, Install included, wraps or shifts to its left). -->
      <div id="sensor-slot" class="topbar__sensor-slot"></div>
    </header>
    <p id="install-hint" class="install-hint" hidden></p>
    <main id="app" class="app"></main>
    <nav class="bottombar" aria-label="Actions">
      <button id="settings-button" class="bottombar__button" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </g>
        </svg>
      </button>
      <button
        id="sound-button"
        class="bottombar__button bottombar__button--primary"
        type="button"
        aria-label="Mute sound"
      >
        <svg
          id="sound-icon"
          class="bottombar__icon"
          viewBox="0 0 24 24"
          width="26"
          height="26"
          aria-hidden="true"
        >
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" stroke="none" />
            <path id="sound-icon-waves" d="M16.5 8.5a5 5 0 0 1 0 7M19.2 6a8.5 8.5 0 0 1 0 12" />
            <path id="sound-icon-mute" d="M16 8.5 21 15.5M21 8.5 16 15.5" hidden />
          </g>
        </svg>
      </button>
      <button id="help-button" class="bottombar__button" type="button" aria-label="Help">?</button>
    </nav>
    <footer class="site-footer">
      <p id="app-version" class="site-footer__version"></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
