<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="description" content="Level your motorhome / RV with your phone." />
    <title>LevelMate</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <header class="topbar">
      <img class="topbar__icon" src="icons/icon.svg" alt="" width="28" height="28" />
      <h1 class="topbar__title">LevelMate</h1>
      <div id="indicators"></div>
      <button id="install-button" class="topbar__install" type="button" hidden>Install</button>
      <button id="menu-button" class="topbar__menu" type="button" aria-label="Menu">☰</button>
    </header>
    <p id="install-hint" class="install-hint" hidden>
      Tap <strong>Share</strong>, then <strong>“Add to Home Screen”</strong>.
    </p>
    <main id="app" class="app"></main>
    <footer class="site-footer">
      <p id="app-version" class="site-footer__version"></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
