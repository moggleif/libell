name: Update release notes

# Applies the checked-in notes files docs/releases/<tag>.md to their
# matching GitHub Releases, so release texts are version-controlled and
# reviewable like everything else. Runs automatically when a notes file
# (or this workflow) lands on main; idempotent — releases without a notes
# file, and notes files without a release, are left alone.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/releases/**'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply notes files to matching releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for FILE in docs/releases/*.md; do
            TAG=$(basename "$FILE" .md)
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file "$FILE"
              echo "Updated release ${TAG} from ${FILE}"
            else
              echo "No release for ${TAG} yet — skipping"
            fi
          done
