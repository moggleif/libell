name: Dependabot auto-merge

# Turns on GitHub's auto-merge for a Dependabot PR whose updates are all patch
# or minor, so it merges itself once the required check "Check, Test & Build"
# is green. A major version is left for a person (#694, ADR 0021). Runs on
# pull_request, not pull_request_target, and never checks out the PR's code.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Only a PR Dependabot opened, on an event Dependabot itself caused: a
    # person's push to its branch leaves the PR for a person to merge.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    # Enabling auto-merge needs write on the PR and on the contents it merges.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and minor
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --merge "$PR_URL"
