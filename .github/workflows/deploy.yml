name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; only the job that needs more gets it (#540).
permissions:
  contents: read

# A half-deployed PWA serves a stale service worker, so let a running deploy
# finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Release handling (ADR 0007): the VERSION file holds major.minor, or
  # major.minor.patch for a patch release (#611). The first deploy of a
  # version is its release — X.Y.0 or X.Y.Z, tagged and published as a
  # GitHub Release. Every later merge on it is a QA build (Pages doubles
  # as the QA server): the release it builds on plus the merged PR number,
  # shown as "X.Y.Z – CR<PR>" and tagged "vX.Y.Z-CR<PR>". The rules live
  # in scripts/version.ts, where they are unit-tested.
  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version_string: ${{ steps.version.outputs.version_string }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Node 22 runs the TypeScript script directly; no install needed.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Compute version from VERSION file, tags and PR number
        id: version
        run: node scripts/compute-version.ts

  deploy:
    name: Build & Deploy
    needs: compute-version
    runs-on: ubuntu-latest
    # Publishing to Pages needs a Pages-write token and an OIDC token.
    # Job permissions replace the workflow's, so checkout's read is kept.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before the build: its base path is where Pages serves the site, ""
      # at the root of the custom domain, "/libell" on the project site
      # (#672), so every deploy fits whichever the Pages setting says.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # First run on a fresh repo: enable Pages (source: GitHub Actions)
          # instead of requiring a manual settings step.
          enablement: true

      - name: Build
        run: npm run build
        env:
          BUILD_VERSION: ${{ needs.compute-version.outputs.version_string }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Generate manifest screenshots
        run: |
          npx playwright install --with-deps chromium
          npm run screenshots
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # /.well-known/ (public/.well-known/) is a dot-directory, which the
          # action leaves out unless told otherwise; Google Play's
          # assetlinks.json lives there (#671, #672).
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  tag:
    name: Tag release
    needs: [compute-version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create annotated git tag
        env:
          TAG: ${{ needs.compute-version.outputs.tag_name }}
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Production deploy $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag ${TAG}"
          fi

      - name: Create GitHub Release (the release itself, not candidates)
        if: needs.compute-version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.compute-version.outputs.tag_name }}
        run: |
          # Prefer the checked-in notes file: the release-notes workflow
          # runs on the same push and would find no release to update yet.
          if [ -f "docs/releases/${TAG}.md" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "docs/releases/${TAG}.md"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
