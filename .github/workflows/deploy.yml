name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A half-deployed PWA serves a stale service worker, so let a running deploy
# finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Release handling: the VERSION file holds major.minor. The first
  # deploy of a new major.minor is the release — version X.Y.0, tagged
  # and published as a GitHub Release. Every later merge on the same
  # minor is a QA build (Pages doubles as the QA server): versioned
  # X.Y.CR<PR> after the merged pull request, so the footer tells at a
  # glance whether the deployed build is the release or a candidate.
  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version_string: ${{ steps.version.outputs.version_string }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      is_new_minor: ${{ steps.version.outputs.is_new_minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version from VERSION file and PR number
        id: version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          # Merge and squash commits both carry "#<PR>" in the subject.
          # Direct pushes and manual dispatches have none — fall back to
          # the workflow run number so the tag stays unique.
          MSG=$(git log -1 --pretty=%s)
          PATCH=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          if [ -z "$PATCH" ]; then
            PATCH="${GITHUB_RUN_NUMBER}"
            echo "No PR number in '$MSG' — falling back to run number ${PATCH}"
          fi
          if [ -z "$(git tag --list "v${BASE}.*")" ]; then
            # First deploy of this major.minor: the release, X.Y.0.
            IS_NEW_MINOR=true
            VERSION_STRING="${BASE}.0"
          else
            # Already released: this is a QA/candidate build, X.Y.CR<PR>.
            IS_NEW_MINOR=false
            VERSION_STRING="${BASE}.CR${PATCH}"
          fi
          TAG="v${VERSION_STRING}"
          echo "version_string=${VERSION_STRING}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "is_new_minor=${IS_NEW_MINOR}" >> $GITHUB_OUTPUT
          echo "Computed version: ${TAG} (is_new_minor=${IS_NEW_MINOR})"

  deploy:
    name: Build & Deploy
    needs: compute-version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BUILD_VERSION: ${{ needs.compute-version.outputs.version_string }}

      - name: Generate manifest screenshots
        run: |
          npx playwright install --with-deps chromium
          npm run screenshots

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # First run on a fresh repo: enable Pages (source: GitHub Actions)
          # instead of requiring a manual settings step.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  tag:
    name: Tag release
    needs: [compute-version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create annotated git tag
        env:
          TAG: ${{ needs.compute-version.outputs.tag_name }}
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Production deploy $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag ${TAG}"
          fi

      - name: Create GitHub Release (new major.minor only)
        if: needs.compute-version.outputs.is_new_minor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.compute-version.outputs.tag_name }}
        run: |
          # Prefer the checked-in notes file: the release-notes workflow
          # runs on the same push and would find no release to update yet.
          if [ -f "docs/releases/${TAG}.md" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "docs/releases/${TAG}.md"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
