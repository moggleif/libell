name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A half-deployed PWA serves a stale service worker, so let a running deploy
# finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Release handling: the VERSION file holds major.minor, and the third
  # component is the merged PR's number, so every deployed version maps
  # straight to its pull request. Each deploy is tagged; the first deploy
  # of a new major.minor also gets a GitHub Release.
  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version_string: ${{ steps.version.outputs.version_string }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      is_new_minor: ${{ steps.version.outputs.is_new_minor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Compute version from VERSION file and PR number
        id: version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          # Merge and squash commits both carry "#<PR>" in the subject.
          # Direct pushes and manual dispatches have none — fall back to
          # the workflow run number so the tag stays unique.
          MSG=$(git log -1 --pretty=%s)
          PATCH=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          if [ -z "$PATCH" ]; then
            PATCH="${GITHUB_RUN_NUMBER}"
            echo "No PR number in '$MSG' — falling back to run number ${PATCH}"
          fi
          if [ -z "$(git tag --list "v${BASE}.*")" ]; then
            IS_NEW_MINOR=true
          else
            IS_NEW_MINOR=false
          fi
          TAG="v${BASE}.${PATCH}"
          echo "version_string=${BASE}.${PATCH}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "is_new_minor=${IS_NEW_MINOR}" >> $GITHUB_OUTPUT
          echo "Computed version: ${TAG} (is_new_minor=${IS_NEW_MINOR})"

  deploy:
    name: Build & Deploy
    needs: compute-version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BUILD_VERSION: ${{ needs.compute-version.outputs.version_string }}

      - name: Generate manifest screenshots
        run: |
          npx playwright install --with-deps chromium
          npm run screenshots

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # First run on a fresh repo: enable Pages (source: GitHub Actions)
          # instead of requiring a manual settings step.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  tag:
    name: Tag release
    needs: [compute-version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create annotated git tag
        env:
          TAG: ${{ needs.compute-version.outputs.tag_name }}
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Production deploy $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag ${TAG}"
          fi

      - name: Create GitHub Release (new major.minor only)
        if: needs.compute-version.outputs.is_new_minor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.compute-version.outputs.tag_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
