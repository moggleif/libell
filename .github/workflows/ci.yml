name: CI

# Pushes to a PR branch are covered by the pull_request run (which tests the
# branch merged with main), so push only runs on main itself (#471).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# The two slow Playwright checks, `flows` and `fit`, run as their own jobs
# beside the rest instead of after it (#473). Each job builds the app itself:
# the build takes seconds, less than passing dist/ between jobs.
jobs:
  checks:
    name: Checks, unit tests & smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage floor
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Smoke test the built app
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libell-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # The external-sensor flows through the real wiring in main.ts (#374),
  # against the simulated boxes.
  flows:
    name: Box flows in the built app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Box flows in the built app
        run: |
          npx playwright install --with-deps chromium
          npm run flows

  # The one check that can fail on a view growing taller than a phone
  # screen (#239, #241) — the unit tests run in happy-dom, which has
  # no layout engine and so measures every height as zero.
  #
  # One job per appearance, side by side (#494): the sweep is mostly
  # settle pauses, so three in parallel take well under half the time of
  # one after the other. The list must name every appearance in
  # src/domain/appearance.ts — scripts/fitAppearances.test.ts fails if not.
  fit:
    name: Level view and guide fit one phone screen (${{ matrix.appearance }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        appearance: [classic, modern, glossy]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Level view and guide fit one phone screen
        env:
          FIT_APPEARANCE: ${{ matrix.appearance }}
        run: |
          npx playwright install --with-deps chromium
          npm run fit

  # The required status check on main is named "Check, Test & Build", so
  # this job keeps that name and passes only when all the jobs above
  # passed (a matrix job's result is failure if any of its legs failed). `always()` matters: without it a failed job would leave this
  # one skipped, and GitHub counts a skipped required check as passing.
  build:
    name: Check, Test & Build
    needs: [checks, flows, fit]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.flows.result }} ${{ needs.fit.result }}
        run: |
          echo "checks, flows, fit: ${RESULTS}"
          for RESULT in ${RESULTS}; do
            [ "$RESULT" = success ] || exit 1
          done
